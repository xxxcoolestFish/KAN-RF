[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kanrf"
version = "0.2.0"
description = "Cognitive Pullback Bellman Networks with ProtoKAN dynamics"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["kanrf*", "cpbn*"]
